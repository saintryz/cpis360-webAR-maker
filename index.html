<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Black Hole Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
    <script src="main.js"></script>
  </head>
  <body>
    <div id="hudLabel" class="hud-label" role="status" aria-live="polite">
      ☀️ Hiro: Solar System · Kanji: Black Hole
    </div>
    <button id="modeButton" class="mode-button" type="button" aria-label="Change black hole mode">
      Normal
    </button>

    <a-scene
      embedded
      renderer="antialias: true; alpha: true; colorManagement: true; physicallyCorrectLights: true"
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      vr-mode-ui="enabled: false">
      <a-marker id="hiroMarker" preset="hiro">
        <a-entity solar-system-scene></a-entity>
      </a-marker>
      <a-marker id="kanjiMarker" preset="kanji">
        <a-entity blackhole-scene></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
